<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">He Junbo — AI-native product builder</title>
  <desc id="desc">A dark technical banner showing product signals moving toward a working system.</desc>
  <defs>
    <linearGradient id="bg" x1="62" y1="20" x2="1125" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C1224"/>
      <stop offset="0.55" stop-color="#10182D"/>
      <stop offset="1" stop-color="#071A22"/>
    </linearGradient>
    <linearGradient id="line" x1="710" y1="70" x2="1110" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#65E6D3"/>
      <stop offset="1" stop-color="#8B7CFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1002 151) rotate(132) scale(265 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D6C0" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#34D6C0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#C5D2EA" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="358" rx="27" stroke="#B7C7E6" stroke-opacity="0.13" stroke-width="2"/>

  <g opacity="0.9">
    <rect x="64" y="54" width="166" height="32" rx="16" fill="#65E6D3" fill-opacity="0.1" stroke="#65E6D3" stroke-opacity="0.35"/>
    <circle cx="82" cy="70" r="4" fill="#65E6D3"/>
    <text x="95" y="75" fill="#9CF1E5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1.4">AIPM · BUILDING</text>
  </g>

  <text x="64" y="155" fill="#F5F7FB" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="58" font-weight="760" letter-spacing="-2.4">HE JUNBO</text>
  <text x="66" y="201" fill="#AEBBD2" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="23" font-weight="500" letter-spacing="4.4">AI-NATIVE PRODUCT BUILDER</text>

  <line x1="66" y1="238" x2="580" y2="238" stroke="#AEBBD2" stroke-opacity="0.2"/>
  <text x="66" y="277" fill="#C9D3E3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17" font-weight="450">Signal</text>
  <text x="137" y="277" fill="#65E6D3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17">→</text>
  <text x="170" y="277" fill="#C9D3E3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17" font-weight="450">Product judgment</text>
  <text x="319" y="277" fill="#65E6D3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17">→</text>
  <text x="352" y="277" fill="#C9D3E3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17" font-weight="450">Working software</text>

  <g>
    <path d="M706 119C779 82 825 109 872 157C917 203 978 254 1110 216" stroke="url(#line)" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 10"/>
    <path d="M704 245C773 259 819 232 862 183C909 129 979 99 1102 132" stroke="#8B7CFF" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round"/>

    <circle cx="706" cy="119" r="8" fill="#10182D" stroke="#65E6D3" stroke-width="3"/>
    <circle cx="706" cy="245" r="6" fill="#10182D" stroke="#8B7CFF" stroke-width="2"/>
    <circle cx="872" cy="157" r="12" fill="#65E6D3" fill-opacity="0.15" stroke="#65E6D3" stroke-width="2"/>
    <circle cx="862" cy="183" r="5" fill="#8B7CFF"/>
    <circle cx="1102" cy="132" r="7" fill="#10182D" stroke="#8B7CFF" stroke-width="2"/>
    <circle cx="1110" cy="216" r="14" fill="#65E6D3" fill-opacity="0.15" stroke="#65E6D3" stroke-width="2"/>
    <circle cx="1110" cy="216" r="34" fill="#65E6D3" fill-opacity="0.08" filter="url(#soft)"/>

    <text x="683" y="100" fill="#7E8DA7" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" letter-spacing="1">SIGNAL</text>
    <text x="826" y="135" fill="#9CF1E5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" letter-spacing="1">DECISION</text>
    <text x="1048" y="249" fill="#9CF1E5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" letter-spacing="1">SYSTEM</text>
  </g>

  <text x="1134" y="326" fill="#7887A1" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">github.com/Jasper-bo</text>
</svg>
